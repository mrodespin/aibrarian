    <!-- interactive-widget=resizes-content: in browsers that support it
         (Safari 17.4+, Chrome 108+) this makes the browser itself shrink
         the layout viewport when the virtual keyboard appears, instead of
         just shifting/compressing the visual viewport. With this,
         dvh/--app-height adjust natively and the useViewportHeight hook
         becomes just a fallback for older browsers. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content" />
