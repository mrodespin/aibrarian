<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <!-- interactive-widget=resizes-content: en navegadores que lo soportan
         (Safari 17.4+, Chrome 108+) hace que el propio navegador encoja el
         layout viewport cuando aparece el teclado virtual, en vez de solo
         desplazar/comprimir el visual viewport. Con esto, dvh/--app-height
         se ajustan de forma nativa y el hook useViewportHeight pasa a ser
         solo un fallback para navegadores más antiguos. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content" />
    <title>Bibliotecario-IA</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
