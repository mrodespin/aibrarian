# /docker-compose.yml
# ChromaDB - Base de datos vectorial para Bibliotecario-IA
#
# Uso:
#   docker-compose up -d chromadb
#
# Nota: Ollama y la API FastAPI corren de forma NATIVA en macOS:
#   - Ollama: brew install ollama && ollama serve (GPU Metal)
#   - API: cd api && uvicorn app.main:app --reload

services:
  chromadb:
    image: chromadb/chroma:0.5.20
    ports:
      - "8001:8000"
    volumes:
      - chroma_data:/chroma/chroma

volumes:
  chroma_data:
