# /docker-compose.yml
# Servicios Docker para Bibliotecario-IA
#
# Uso:
#   docker-compose up -d
#
# Servicios:
#   - chromadb: Base de datos vectorial (puerto 8001)
#   - api: Backend FastAPI (puerto 8000)
#
# Nota: Ollama corre de forma NATIVA en macOS para aprovechar GPU Metal (~10x más rápido)
#   Instalación: brew install ollama && ollama serve

services:
  chromadb:
    image: chromadb/chroma:1.5.9
    ports:
      - "8001:8000"
    volumes:
      - chroma_data:/chroma/chroma
    healthcheck:
      # /api/v1/heartbeat da 410 Gone desde que se subió la imagen a 1.5.9
      # (v1 de la API retirada); usar /api/v2/heartbeat en su lugar.
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v2/heartbeat"]
      interval: 10s
      timeout: 5s
      retries: 3

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./api/app:/app/app      # Hot-reload para desarrollo
      - ./data:/app/data:ro     # PDFs locales (solo lectura)
    env_file:
      - ./api/.env              # Variables de usuario (NOTION_API_KEY, etc.)
    environment:
      # Overrides de networking para Docker
      # Ollama corre en el host (macOS nativo para GPU Metal)
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      # ChromaDB corre en Docker (puerto interno)
      - CHROMADB_HOST=chromadb
      - CHROMADB_PORT=8000
      - DATA_DIRECTORY=/app/data
    depends_on:
      chromadb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

volumes:
  chroma_data:
