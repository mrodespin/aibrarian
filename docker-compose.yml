# /docker-compose.yml
# Servicios Docker para Bibliotecario-IA
#
# Uso:
#   docker-compose up -d
#
# Servicios:
#   - chromadb: Base de datos vectorial (puerto 8001)
#   - postgres: Usuarios/autenticación (puerto 5432) — solo desarrollo local;
#     en producción (Render) se usa Neon (Postgres hosteado, sin disco
#     persistente en el contenedor de la API, ver ADR-007/render.yaml)
#   - api: Backend FastAPI (puerto 8000)
#
# Nota: Ollama corre de forma NATIVA en macOS para aprovechar GPU Metal (~10x más rápido)
#   Instalación: brew install ollama && ollama serve

services:
  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=bibliotecario
      - POSTGRES_PASSWORD=bibliotecario
      - POSTGRES_DB=bibliotecario
    ports:
      # 127.0.0.1, no 0.0.0.0: estas credenciales son fijas y triviales
      # (solo valen para dev local). Sin este bind explícito, Docker publica
      # el puerto en todas las interfaces — en una máquina con IP pública y
      # sin firewall, cualquiera en internet podría conectarse.
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bibliotecario"]
      interval: 10s
      timeout: 5s
      retries: 5

  chromadb:
    image: chromadb/chroma:1.5.9
    ports:
      # 127.0.0.1, no 0.0.0.0: ChromaDB no tiene auth propia en este setup,
      # y hay una RCE pre-auth conocida (PYSEC-2026-311, sin versión
      # parcheada todavía) si su API queda expuesta en red. El contenedor
      # `api` sigue llegando a este servicio por la red interna de Docker
      # (`chromadb:8000`) sin que esto le afecte — este bind solo limita el
      # acceso desde el host.
      - "127.0.0.1:8001:8000"
    volumes:
      - chroma_data:/chroma/chroma
    healthcheck:
      # La imagen chromadb/chroma:1.5.9 no trae curl ni wget ni python (es
      # una imagen mínima con el binario `chroma` y poco más — confirmado
      # con `docker exec ... ls /bin /usr/bin`), así que un healthcheck
      # basado en curl se queda siempre en "unhealthy" aunque el servidor
      # esté perfectamente arriba (probado: exec falla con "curl: executable
      # file not found in $PATH", no es que el heartbeat responda mal).
      # Usamos el truco de /dev/tcp de bash (sí está disponible) para
      # comprobar que el puerto acepta conexiones — más débil que un check
      # HTTP real (no valida el body del heartbeat), pero suficiente para
      # saber que el proceso está escuchando, y no depende de ningún
      # binario extra en la imagen.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8000"]
      interval: 10s
      timeout: 5s
      retries: 3

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./api/app:/app/app      # Hot-reload para desarrollo
      - ./data:/app/data:ro     # PDFs locales (solo lectura)
    env_file:
      - ./api/.env              # Variables de usuario (NOTION_API_KEY, etc.)
    environment:
      # Overrides de networking para Docker
      # Ollama corre en el host (macOS nativo para GPU Metal)
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      # ChromaDB corre en Docker (puerto interno)
      - CHROMADB_HOST=chromadb
      - CHROMADB_PORT=8000
      - DATA_DIRECTORY=/app/data
      # Postgres corre en Docker (nombre de servicio, no localhost)
      - DATABASE_URL=postgresql://bibliotecario:bibliotecario@postgres:5432/bibliotecario
    depends_on:
      chromadb:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      # python:3.11-slim tampoco trae curl instalado por defecto (mismo
      # problema que el healthcheck de chromadb, ver más arriba) — pero
      # este contenedor SÍ tiene python3 siempre disponible (es la propia
      # app), así que usamos urllib de la stdlib en vez de añadir curl a
      # la imagen solo para esto.
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

volumes:
  chroma_data:
  postgres_data:
