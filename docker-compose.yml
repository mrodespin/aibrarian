# /docker-compose.yml
# Docker services for AIbrarian
#
# Usage:
#   docker-compose up -d
#
# Services:
#   - chromadb: vector database (port 8001)
#   - postgres: users/authentication (port 5432) — local development only;
#     production (Render) uses Neon (hosted Postgres, no persistent disk
#     in the API container, see ADR-007/render.yaml)
#   - api: FastAPI backend (port 8000)
#
# Note: Ollama runs NATIVELY on macOS to take advantage of the Metal GPU (~10x faster)
#   Installation: brew install ollama && ollama serve

services:
  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=aibrarian
      - POSTGRES_PASSWORD=aibrarian
      - POSTGRES_DB=aibrarian
    ports:
      # 127.0.0.1, not 0.0.0.0: these credentials are fixed and trivial
      # (local dev only). Without this explicit bind, Docker publishes
      # the port on every interface — on a machine with a public IP and
      # no firewall, anyone on the internet could connect.
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aibrarian"]
      interval: 10s
      timeout: 5s
      retries: 5

  chromadb:
    image: chromadb/chroma:1.5.9
    ports:
      # 127.0.0.1, not 0.0.0.0: ChromaDB has no auth of its own in this
      # setup, and there's a known pre-auth RCE (PYSEC-2026-311, no patched
      # version yet) if its API is exposed on the network. The `api`
      # container still reaches this service over Docker's internal network
      # (`chromadb:8000`) unaffected — this bind only restricts access from
      # the host.
      - "127.0.0.1:8001:8000"
    volumes:
      - chroma_data:/chroma/chroma
    healthcheck:
      # The chromadb/chroma:1.5.9 image ships with no curl, wget or python
      # (it's a minimal image with the `chroma` binary and little else —
      # confirmed with `docker exec ... ls /bin /usr/bin`), so a curl-based
      # healthcheck stays stuck on "unhealthy" forever even when the server
      # is perfectly up (verified: exec fails with "curl: executable file
      # not found in $PATH", it's not that the heartbeat responds badly).
      # We use bash's /dev/tcp trick (which IS available) to check that the
      # port accepts connections — weaker than a real HTTP check (it doesn't
      # validate the heartbeat's body), but enough to know the process is
      # listening, and it doesn't depend on any extra binary in the image.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8000"]
      interval: 10s
      timeout: 5s
      retries: 3

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./api/app:/app/app      # Hot-reload for development
      - ./data:/app/data:ro     # Local PDFs (read-only)
    env_file:
      - ./api/.env              # User variables (NOTION_API_KEY, etc.)
    environment:
      # Networking overrides for Docker
      # Ollama runs on the host (native macOS for the Metal GPU)
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      # ChromaDB runs in Docker (internal port)
      - CHROMADB_HOST=chromadb
      - CHROMADB_PORT=8000
      - DATA_DIRECTORY=/app/data
      # Postgres runs in Docker (service name, not localhost)
      - DATABASE_URL=postgresql://aibrarian:aibrarian@postgres:5432/aibrarian
    depends_on:
      chromadb:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      # python:3.11-slim doesn't ship curl by default either (same problem
      # as the chromadb healthcheck above) — but this container DOES always
      # have python3 available (it's the app itself), so we use the
      # stdlib's urllib instead of adding curl to the image just for this.
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

volumes:
  chroma_data:
  postgres_data:
