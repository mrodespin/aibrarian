# /docker-compose.yml

# 'version' tag removed as it is obsolete.

services:
  # --------------------------------------------------------------------
  # Service 1: The API (FastAPI)
  # --------------------------------------------------------------------
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./api/app:/app/app
    env_file:
      - ./.env # Passes environment variables (like NOTION_API_KEY)
    depends_on:
      - chromadb

  # --------------------------------------------------------------------
  # Service 2: The Vector Database (ChromaDB)
  # --------------------------------------------------------------------
  chromadb:
    image: chromadb/chroma
    ports:
      - "8001:8000"
    volumes:
      - chroma_data:/chroma/chroma

  # --------------------------------------------------------------------
  # Service 3: The Automation (n8n)
  # --------------------------------------------------------------------
  n8n:
    image: n8nio/n8n
    ports:
      - "5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
    environment:
      - GENERIC_TIMEZONE=Europe/Madrid
      # --- FIX: Add this line to disable secure cookie ---
      - N8N_SECURE_COOKIE=false
    depends_on:
      - api

# --------------------------------------------------------------------
# Named Volumes
# --------------------------------------------------------------------
volumes:
  chroma_data:
  n8n_data: