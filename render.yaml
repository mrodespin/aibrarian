# /render.yaml
# Blueprint de despliegue para Render (https://render.com/docs/blueprint-spec)
#
# Despliega la API (Groq + Chroma Cloud, ver ADR-007) y el frontend (React +
# Vite, servido como Static Site). ChromaDB local no forma parte de este
# blueprint: solo se usa en desarrollo (docker-compose).
#
# Uso:
#   1. Conecta este repo en Render → "New Blueprint Instance"
#   2. Render detecta este fichero y crea los servicios "tfm-bibliotecario-ia"
#      y "bibliotecario-ia-frontend"
#   3. Variables marcadas con "sync: false" NO se versionan aquí: Render
#      pide rellenarlas en el dashboard (Environment) tras el primer deploy
#   4. Primer arranque: usa POST /sync/upload o /sync/notion para indexar
#      documentos en la colección de Chroma Cloud (empieza vacía)
#
# Nota sobre VITE_API_URL (abajo, servicio del frontend): Render no permite
# referenciar la URL PÚBLICA de un servicio desde otro vía `fromService`
# (esa propiedad solo expone el hostname de la red PRIVADA interna, inútil
# aquí porque quien llama a la API es el navegador del usuario, no otro
# servicio de Render). Por eso va como "sync: false", igual que las API
# keys: la rellenas tú a mano en el dashboard (bibliotecario-ia-frontend →
# Environment) con la URL pública que Render le asignó a la API — así no
# queda hardcodeada en el repo ni hay que tocar este fichero si la API
# cambia de nombre o le pones dominio propio.

services:
  - type: web
    name: tfm-bibliotecario-ia
    runtime: docker
    plan: free
    dockerfilePath: ./api/Dockerfile
    dockerContext: ./api
    healthCheckPath: /
    envVars:
      # --- Selección de proveedores (ver ADR-007) ---
      - key: LLM_PROVIDER
        value: groq
      - key: VECTOR_DB_PROVIDER
        value: chroma_cloud

      # --- Groq (gratuito, sin tarjeta): console.groq.com/keys ---
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b

      # --- Embeddings locales (CPU, sin API key) ---
      # onnx = chromadb+onnxruntime (ligero, ver groq_adapter.py). NO cambiar
      # a sentence_transformers aquí: añade ~650MB (torch) y provoca OOM en
      # el free tier de Render (512MB RAM).
      - key: EMBEDDING_BACKEND
        value: onnx
      - key: EMBEDDING_MODEL_NAME
        value: all-MiniLM-L6-v2

      # --- Chroma Cloud (gratuito, sin tarjeta): trychroma.com ---
      - key: CHROMA_CLOUD_API_KEY
        sync: false
      - key: CHROMA_CLOUD_TENANT
        sync: false
      - key: CHROMA_CLOUD_DATABASE
        sync: false

      # --- Notion (opcional) ---
      - key: NOTION_API_KEY
        sync: false
      - key: NOTION_DATABASE_ID
        sync: false

      # --- Resto de configuración (valores por defecto de settings.py) ---
      - key: DATA_DIRECTORY
        value: /app/data

  # --- Frontend (React + Vite, servido como Static Site: gratis, sin
  # "sleep" ni límite de RAM porque no ejecuta ningún proceso, solo sirve
  # los ficheros estáticos de `npm run build` vía CDN) ---
  - type: web
    name: bibliotecario-ia-frontend
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    envVars:
      # Rellena en el dashboard (Environment) con la URL pública de
      # tfm-bibliotecario-ia, ver nota arriba. VITE_API_URL se hornea en
      # el build (Vite la sustituye en tiempo de build, no de arranque),
      # así que cambiar este valor requiere un redeploy manual del
      # frontend para que surta efecto, no basta con reiniciar el servicio.
      - key: VITE_API_URL
        sync: false
    routes:
      # SPA sin backend propio: cualquier ruta debe servir index.html para
      # que el enrutado (si lo hay) lo resuelva React en el cliente.
      - type: rewrite
        source: /*
        destination: /index.html
