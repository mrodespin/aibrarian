# /render.yaml
# Deployment blueprint for Render (https://render.com/docs/blueprint-spec)
#
# Deploys the API (Groq + Chroma Cloud, see ADR-007) and the frontend (React +
# Vite, served as a Static Site). The local ChromaDB isn't part of this
# blueprint: it's only used in development (docker-compose).
#
# Usage:
#   1. Connect this repo in Render → "New Blueprint Instance"
#   2. Render detects this file and creates the "bibliotecario-ia-api"
#      and "bibliotecario-ia-frontend" services
#   3. Variables marked "sync: false" aren't checked into version control:
#      Render asks you to fill them in the dashboard (Environment) after the
#      first deploy
#   4. First startup: use POST /sync/upload or /sync/notion to index
#      documents into the Chroma Cloud collection (starts out empty)
#
# Note on VITE_API_URL (below, frontend service): Render doesn't allow
# referencing a service's PUBLIC URL from another one via `fromService`
# (that property only exposes the internal PRIVATE network hostname, useless
# here since it's the user's browser that calls the API, not another Render
# service). That's why it's "sync: false", just like the API keys: you fill
# it in by hand in the dashboard (bibliotecario-ia-frontend →
# Environment) with the public URL Render assigned to the API — that way it
# never ends up hardcoded in the repo, and this file doesn't need touching if
# the API is renamed or gets its own domain.

services:
  - type: web
    name: bibliotecario-ia-api
    runtime: docker
    plan: free
    dockerfilePath: ./api/Dockerfile
    dockerContext: ./api
    healthCheckPath: /
    envVars:
      # --- Provider selection (see ADR-007) ---
      - key: LLM_PROVIDER
        value: groq
      - key: VECTOR_DB_PROVIDER
        value: chroma_cloud

      # --- Groq (free, no card): console.groq.com/keys ---
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b

      # --- Local embeddings (CPU, no API key) ---
      # onnx = chromadb+onnxruntime (lightweight, see groq_adapter.py). Do NOT
      # switch this to sentence_transformers: it adds ~650MB (torch) and
      # causes an OOM on Render's free tier (512MB RAM).
      - key: EMBEDDING_BACKEND
        value: onnx
      - key: EMBEDDING_MODEL_NAME
        value: all-MiniLM-L6-v2

      # --- Chroma Cloud (free, no card): trychroma.com ---
      - key: CHROMA_CLOUD_API_KEY
        sync: false
      - key: CHROMA_CLOUD_TENANT
        sync: false
      - key: CHROMA_CLOUD_DATABASE
        sync: false

      # --- Notion (optional) ---
      - key: NOTION_API_KEY
        sync: false
      - key: NOTION_DATABASE_ID
        sync: false

      # --- Authentication (Neon Postgres + JWT) ---
      # DATABASE_URL: Neon's connection string (neon.tech — create a free
      # project and copy the connection string from its dashboard). Before
      # filling this in, create the first user against that same URL with
      # scripts/create_user.py — that way login works from the moment this
      # service starts up.
      - key: DATABASE_URL
        sync: false
      # Generate one with: python -c "import secrets; print(secrets.token_hex(32))"
      - key: JWT_SECRET_KEY
        sync: false
      - key: JWT_EXPIRATION_MINUTES
        value: "1440"
      # bibliotecario-ia-frontend's public URL (same reason as VITE_API_URL
      # below: Render doesn't allow referencing another service's public
      # URL, so it's filled in by hand in the dashboard). Used for CORS
      # (allow_origins).
      - key: FRONTEND_URL
        sync: false

      # --- Everything else (settings.py's defaults) ---
      - key: DATA_DIRECTORY
        value: /app/data

  # --- Frontend (React + Vite, served as a Static Site: free, no "sleep"
  # or RAM limit since it runs no process at all, just serves the
  # `npm run build` static files via CDN) ---
  - type: web
    name: bibliotecario-ia-frontend
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    envVars:
      # Fill in the dashboard (Environment) with bibliotecario-ia-api's
      # public URL, see the note above. VITE_API_URL gets baked into the
      # build (Vite substitutes it at build time, not at startup), so
      # changing this value needs a manual frontend redeploy to take
      # effect — restarting the service alone isn't enough.
      - key: VITE_API_URL
        sync: false
    routes:
      # An SPA with no backend of its own: every route must serve index.html
      # so client-side React routing (if any) can resolve it.
      - type: rewrite
        source: /*
        destination: /index.html
