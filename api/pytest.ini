# /api/pytest.ini
# pytest configuration for AIbrarian

[pytest]
# Directory to search for tests
testpaths = tests

# Test file pattern
python_files = test_*.py

# Test class pattern
python_classes = Test*

# Test function pattern
python_functions = test_*

# Show detailed output
addopts =
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    -p no:cacheprovider

# Custom markers
markers =
    unit: unit tests (fast, no external dependencies)
    integration: integration tests (need real services)
    slow: slow tests (>1 second)
    e2e: end-to-end tests of the full flow
    eval: RAG quality evaluation with RAGAS (needs real Ollama + ChromaDB, doesn't run in regular CI)

# Ignore deprecation warnings from external libraries
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
