# /api/pytest.ini
# Configuración de pytest para Bibliotecario-IA

[pytest]
# Directorio donde buscar tests
testpaths = tests

# Patrón de archivos de test
python_files = test_*.py

# Patrón de clases de test
python_classes = Test*

# Patrón de funciones de test
python_functions = test_*

# Mostrar información detallada
addopts =
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    -p no:cacheprovider

# Marcadores personalizados
markers =
    unit: Tests unitarios (rápidos, sin dependencias externas)
    integration: Tests de integración (requieren servicios reales)
    slow: Tests lentos (>1 segundo)
    e2e: Tests end-to-end del flujo completo
    eval: Evaluación de calidad del RAG con RAGAS (requiere Ollama + ChromaDB reales, no corre en CI normal)

# Ignorar warnings de deprecation de librerías externas
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
